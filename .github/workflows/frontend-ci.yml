name: Frontend CI/CD

on:
  push:
    branches: [main]
    paths: ['client/**']
  pull_request:
    branches: [main]
    paths: ['client/**']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
          
      - name: Install dependencies
        run: cd client && npm ci
        
      - name: Lint
        run: cd client && npm run lint || true
        
      - name: Build
        run: cd client && npm run build
        
      - uses: actions/upload-artifact@v3
        with:
          name: dist
          path: client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v3
      
      - name: Deploy to Vercel
        run: npx vercel --prod --token ${{ secrets.VERCEL_TOKEN }} || echo "Vercel deploy skipped"
